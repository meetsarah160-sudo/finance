<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>💰 财务管理系统</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --primary: #667eea;
            --primary-dark: #5a67d8;
            --success: #48bb78;
            --warning: #ed8936;
            --danger: #f56565;
            --gray-100: #f7fafc;
            --gray-200: #edf2f7;
            --gray-300: #e2e8f0;
            --gray-600: #718096;
            --gray-800: #2d3748;
            --pink-100: #fff5f5;
            --green-100: #f0fff4;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 10px;
        }
        
        .container { max-width: 1200px; margin: 0 auto; }
        
        /* 登录页面 */
        .login-container {
            max-width: 400px;
            margin: 50px auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        
        .login-container h1 { text-align: center; margin-bottom: 10px; font-size: 28px; }
        .login-container .subtitle { text-align: center; color: var(--gray-600); margin-bottom: 30px; }
        
        .login-container input {
            width: 100%;
            padding: 15px;
            border: 2px solid var(--gray-300);
            border-radius: 10px;
            font-size: 16px;
            margin-bottom: 15px;
        }
        
        .login-container input:focus { outline: none; border-color: var(--primary); }
        
        .login-btn {
            width: 100%;
            padding: 15px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
        }
        
        .login-btn:hover { background: var(--primary-dark); }
        .login-btn:disabled { background: #a0aec0; cursor: not-allowed; }
        
        .login-container .tip {
            margin-top: 20px;
            padding: 15px;
            background: #ebf8ff;
            border-radius: 10px;
            font-size: 14px;
            color: #2c5282;
        }
        
        /* 头部 */
        .header {
            background: white;
            border-radius: 16px;
            padding: 15px 20px;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .header h1 { font-size: 20px; color: var(--gray-800); }
        
        .header-info {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        
        .user-badge {
            background: var(--gray-100);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 14px;
        }
        
        .sync-status {
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 10px;
        }
        
        .sync-status.synced { background: var(--green-100); color: var(--success); }
        .sync-status.syncing { background: #fefcbf; color: var(--warning); }
        .sync-status.error { background: var(--pink-100); color: var(--danger); }
        
        .header-buttons { display: flex; gap: 8px; }
        
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-dark); }
        .btn-success { background: var(--success); color: white; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-warning { background: var(--warning); color: white; }
        .btn-sm { padding: 6px 12px; font-size: 12px; }
        .btn-outline { background: white; border: 2px solid var(--gray-300); color: var(--gray-800); }
        .btn-outline:hover { border-color: var(--primary); color: var(--primary); }
        
        /* 导航标签 */
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
            flex-wrap: nowrap;
            overflow-x: auto;
            padding-bottom: 5px;
            -webkit-overflow-scrolling: touch;
        }
        
        .tab {
            background: rgba(255,255,255,0.9);
            border: none;
            padding: 10px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
            white-space: nowrap;
            color: var(--gray-800);
        }
        
        .tab:hover { background: white; }
        .tab.active { background: var(--primary); color: white; }
        
        /* 主内容区 */
        .main-content {
            background: white;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            min-height: 400px;
        }
        
        .page { display: none; }
        .page.active { display: block; }
        
        .page-title {
            font-size: 18px;
            color: var(--gray-800);
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--gray-200);
        }
        
        /* 提示条 */
        .tip-bar {
            background: var(--green-100);
            border-radius: 10px;
            padding: 12px 15px;
            margin-bottom: 15px;
            font-size: 14px;
            color: #276749;
        }
        
        /* 快速输入 */
        .quick-input-section { margin-bottom: 20px; }
        
        .quick-input {
            display: flex;
            gap: 10px;
        }
        
        .quick-input input {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid var(--gray-300);
            border-radius: 10px;
            font-size: 16px;
        }
        
        .quick-input input:focus { outline: none; border-color: var(--primary); }
        
        /* 表单 */
        .form-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }
        
        @media (max-width: 600px) {
            .form-row { grid-template-columns: 1fr; }
        }
        
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
            font-size: 14px;
            color: var(--gray-600);
        }
        
        .form-group input, .form-group select {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid var(--gray-300);
            border-radius: 8px;
            font-size: 16px;
        }
        
        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: var(--primary);
        }
        
        /* 类目选择 */
        .category-section { margin-bottom: 15px; }
        
        .category-section-title {
            padding: 10px 15px;
            background: var(--gray-100);
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .category-section-title::after {
            content: '▼';
            font-size: 10px;
            transition: transform 0.2s;
        }
        
        .category-section-title.collapsed::after { transform: rotate(-90deg); }
        
        .category-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
            padding: 10px 0;
            transition: all 0.3s;
        }
        
        .category-grid.collapsed { display: none; }
        
        .category-btn {
            padding: 12px;
            border: 2px solid var(--gray-200);
            border-radius: 10px;
            background: white;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s;
        }
        
        .category-btn:hover { border-color: var(--primary); }
        .category-btn.selected { border-color: var(--primary); background: #ebf4ff; }
        .category-btn.rigid { background: var(--pink-100); border-color: #fed7d7; }
        .category-btn.rigid.selected { border-color: var(--danger); }
        
        .category-btn .name { font-weight: 600; font-size: 14px; margin-bottom: 4px; }
        .category-btn .budget { font-size: 12px; color: var(--gray-600); }
        
        /* 汇总卡片 */
        .summary-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }
        
        .summary-card {
            background: var(--gray-100);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
        }
        
        .summary-card h3 { font-size: 12px; color: var(--gray-600); margin-bottom: 8px; }
        .summary-card .amount { font-size: 20px; font-weight: 700; color: var(--gray-800); }
        .summary-card .sub { font-size: 11px; color: var(--gray-600); margin-top: 5px; }
        
        .summary-card.success { background: var(--green-100); }
        .summary-card.success .amount { color: var(--success); }
        .summary-card.warning { background: #fefcbf; }
        .summary-card.warning .amount { color: var(--warning); }
        .summary-card.danger { background: var(--pink-100); }
        .summary-card.danger .amount { color: var(--danger); }
        
        /* 预算类目列表 - 可点击展开 */
        .budget-category {
            border: 1px solid var(--gray-200);
            border-radius: 12px;
            margin-bottom: 10px;
            overflow: hidden;
        }
        
        .budget-category-header {
            padding: 15px;
            background: var(--gray-100);
            cursor: pointer;
            display: grid;
            grid-template-columns: 1fr auto auto auto;
            gap: 15px;
            align-items: center;
        }
        
        .budget-category-header:hover { background: var(--gray-200); }
        
        .budget-category-header .name { font-weight: 600; }
        .budget-category-header .spent { font-weight: 600; }
        .budget-category-header .progress-mini {
            width: 80px;
            height: 8px;
            background: var(--gray-300);
            border-radius: 4px;
            overflow: hidden;
        }
        
        .budget-category-header .progress-mini .fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.3s;
        }
        
        .budget-category-header .progress-mini .fill.ok { background: var(--success); }
        .budget-category-header .progress-mini .fill.warning { background: var(--warning); }
        .budget-category-header .progress-mini .fill.danger { background: var(--danger); }
        
        .budget-category-header .toggle {
            font-size: 12px;
            color: var(--gray-600);
            transition: transform 0.2s;
        }
        
        .budget-category.expanded .toggle { transform: rotate(180deg); }
        
        .budget-category-detail {
            display: none;
            padding: 15px;
            background: white;
            border-top: 1px solid var(--gray-200);
        }
        
        .budget-category.expanded .budget-category-detail { display: block; }
        
        .detail-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px dashed var(--gray-200);
            font-size: 14px;
        }
        
        .detail-item:last-child { border-bottom: none; }
        .detail-item .date { color: var(--gray-600); }
        .detail-item .item { flex: 1; margin: 0 15px; }
        .detail-item .amount { font-weight: 600; }
        
        .no-data { color: var(--gray-600); font-style: italic; padding: 10px 0; }
        
        /* 记录列表 */
        .record-list { margin-top: 15px; }
        
        .record-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            background: var(--gray-100);
            border-radius: 10px;
            margin-bottom: 8px;
        }
        
        .record-item .info { flex: 1; }
        .record-item .date { font-size: 12px; color: var(--gray-600); }
        .record-item .desc { font-weight: 500; margin: 3px 0; }
        .record-item .cat { font-size: 12px; color: var(--gray-600); }
        .record-item .amount { font-size: 18px; font-weight: 700; color: var(--danger); margin-right: 10px; }
        
        .record-actions { display: flex; gap: 5px; }
        
        /* 设置页面 */
        .settings-tip {
            background: var(--green-100);
            padding: 12px 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 14px;
            color: #276749;
        }
        
        .settings-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .type-legend {
            display: flex;
            gap: 15px;
            font-size: 12px;
        }
        
        .type-legend span { padding: 4px 10px; border-radius: 5px; }
        .type-legend .rigid { background: var(--pink-100); color: var(--danger); }
        .type-legend .daily { background: #fefcbf; color: var(--warning); }
        .type-legend .flexible { background: var(--green-100); color: var(--success); }
        
        .category-setting-item {
            display: grid;
            grid-template-columns: 40px 1fr 100px 80px 50px;
            gap: 10px;
            align-items: center;
            padding: 10px;
            background: var(--gray-100);
            border-radius: 10px;
            margin-bottom: 8px;
        }
        
        @media (max-width: 600px) {
            .category-setting-item {
                grid-template-columns: 30px 1fr 80px 70px 40px;
                gap: 5px;
                font-size: 12px;
            }
        }
        
        .category-setting-item input {
            padding: 8px;
            border: 1px solid var(--gray-300);
            border-radius: 6px;
            font-size: 14px;
        }
        
        .category-setting-item select {
            padding: 8px;
            border: 1px solid var(--gray-300);
            border-radius: 6px;
            font-size: 12px;
        }
        
        .category-setting-item .delete-btn {
            background: var(--danger);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 8px;
            cursor: pointer;
        }
        
        .add-category-btn {
            width: 100%;
            padding: 15px;
            background: var(--gray-100);
            border: 2px dashed var(--gray-300);
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            color: var(--gray-600);
            margin-top: 10px;
        }
        
        .add-category-btn:hover { border-color: var(--primary); color: var(--primary); }
        
        /* AI分析页面 */
        .ai-tip {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 20px;
            border-radius: 12px;
            margin-bottom: 20px;
        }
        
        .ai-tip h3 { margin-bottom: 8px; }
        .ai-tip p { font-size: 14px; opacity: 0.9; }
        
        .ai-report {
            background: var(--gray-100);
            border-radius: 12px;
            padding: 20px;
            white-space: pre-wrap;
            line-height: 1.8;
            font-size: 14px;
            max-height: 500px;
            overflow-y: auto;
        }
        
        /* Toast */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 24px;
            border-radius: 10px;
            color: white;
            font-weight: 500;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .toast.show { opacity: 1; }
        .toast.success { background: var(--success); }
        .toast.error { background: var(--danger); }
        .toast.warning { background: var(--warning); }
        
        /* 弹窗 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }
        
        .modal {
            background: white;
            border-radius: 16px;
            padding: 25px;
            max-width: 400px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
        }
        
        .modal h3 { margin-bottom: 20px; }
        .modal .form-group { margin-bottom: 15px; }
        .modal-buttons { display: flex; gap: 10px; margin-top: 20px; }
        .modal-buttons .btn { flex: 1; }
        
        /* 隐藏 */
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <!-- 登录页面 -->
    <div id="loginPage" class="login-container">
        <h1>💰 财务管理</h1>
        <p class="subtitle">云同步 · 多设备 · AI分析</p>
        <input type="text" id="loginNickname" placeholder="输入你的昵称（如：小王）">
        <button class="login-btn" id="loginBtn" onclick="login()">🚀 开始使用</button>
        <div class="tip">
            💡 同一昵称 = 同一账户，手机电脑数据自动同步
        </div>
    </div>
    
    <!-- 主应用 -->
    <div id="mainApp" class="container hidden">
        <!-- 头部 -->
        <div class="header">
            <h1>💰 财务管理</h1>
            <div class="header-info">
                <span class="user-badge">👤 <span id="displayUser"></span></span>
                <span class="sync-status synced" id="syncStatus">✓ 已同步</span>
            </div>
            <div class="header-buttons">
                <button class="btn btn-outline btn-sm" onclick="exportData()">📤 导出</button>
                <button class="btn btn-outline btn-sm" onclick="importData()">📥 导入</button>
                <button class="btn btn-outline btn-sm" onclick="syncData()">🔄 同步</button>
                <button class="btn btn-danger btn-sm" onclick="logout()">退出</button>
            </div>
        </div>
        
        <!-- 导航标签 -->
        <div class="tabs">
            <button class="tab active" onclick="switchPage('record', event)">📝 记账</button>
            <button class="tab" onclick="switchPage('budget', event)">📊 预算</button>
            <button class="tab" onclick="switchPage('history', event)">📅 记录</button>
            <button class="tab" onclick="switchPage('ai', event)">🏦 理财分析</button>
            <button class="tab" onclick="switchPage('settings', event)">⚙️ 设置</button>
        </div>
        
        <!-- 主内容区 -->
        <div class="main-content">
            <!-- 记账页面 -->
            <div id="page-record" class="page active">
                <h2 class="page-title">📝 快速记账</h2>
                
                <div class="tip-bar" id="budgetTip"></div>
                
                <div class="quick-input-section">
                    <label style="font-weight: 500; margin-bottom: 8px; display: block;">快速输入</label>
                    <div class="quick-input">
                        <input type="text" id="quickInput" placeholder="例如：咖啡25、打车15">
                        <button class="btn btn-primary" onclick="parseQuickInput()">解析</button>
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label>日期</label>
                        <input type="date" id="expenseDate">
                    </div>
                    <div class="form-group">
                        <label>项目</label>
                        <input type="text" id="expenseItem" placeholder="消费项目">
                    </div>
                    <div class="form-group">
                        <label>金额</label>
                        <input type="number" id="expenseAmount" placeholder="0.00" step="0.01">
                    </div>
                </div>
                
                <label style="font-weight: 500; margin-bottom: 10px; display: block;">选择类目</label>
                <div id="categoryGrid"></div>
                
                <button class="btn btn-success" style="width: 100%; padding: 15px; font-size: 16px; margin-top: 15px;" onclick="saveExpense()">💾 保存</button>
            </div>
            
            <!-- 预算页面 -->
            <div id="page-budget" class="page">
                <h2 class="page-title">📊 本月预算</h2>
                
                <div class="summary-cards" id="summaryCards"></div>
                
                <div style="font-size: 14px; color: var(--gray-600); margin-bottom: 15px;">
                    💡 点击类目可展开查看具体消费明细
                </div>
                
                <div id="budgetList"></div>
            </div>
            
            <!-- 记录页面 -->
            <div id="page-history" class="page">
                <h2 class="page-title">📅 消费记录</h2>
                
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                    <select id="historyMonth" onchange="renderHistory()" style="padding: 10px; border-radius: 8px; border: 2px solid var(--gray-300);"></select>
                    <span id="historyTotal" style="font-size: 14px; color: var(--gray-600);"></span>
                </div>
                
                <div id="historyList" class="record-list"></div>
            </div>
            
            <!-- AI分析页面 -->
            <div id="page-ai" class="page">
                <h2 class="page-title">🏦 AI理财分析</h2>
                
                <div class="ai-tip">
                    <h3>✨ 专业理财师为您服务</h3>
                    <p>AI会分析您的消费数据，生成：<strong>本月诊断</strong> → <strong>下月计划</strong> → <strong>年度规划</strong> → <strong>行动清单</strong></p>
                </div>
                
                <button class="btn btn-primary" style="width: 100%; padding: 15px; font-size: 16px; margin-bottom: 20px;" onclick="generateAIReport()">🤖 生成理财分析报告</button>
                
                <div class="ai-report" id="aiReport">
                    点击上方按钮，让AI为您分析财务状况...
                </div>
            </div>
            
            <!-- 设置页面 -->
            <div id="page-settings" class="page">
                <h2 class="page-title">⚙️ 类目设置</h2>
                
                <div class="settings-tip">
                    💡 修改后会自动保存并同步到云端
                </div>
                
                <div class="settings-header">
                    <div class="type-legend">
                        <span>类型：</span>
                        <span class="rigid">刚性=不计入月预算</span>
                        <span class="daily">日常=固定月预算</span>
                        <span class="flexible">弹性=年预算÷12</span>
                    </div>
                </div>
                
                <div id="settingsList"></div>
                
                <button class="add-category-btn" onclick="addCategory()">➕ 添加新类目</button>
            </div>
        </div>
    </div>
    
    <!-- Toast提示 -->
    <div class="toast" id="toast"></div>
    
    <script>
        // ==================== 配置 ====================
        const SUPABASE_URL = 'https://prenbykygxskibdufhol.supabase.co';

        function getMonthly(cat) {
            if (cat.type === '日常') return Math.round(cat.yearly / 12);
            if (cat.type === '弹性') return Math.round(cat.yearly / 12);
            return Math.round(cat.yearly / 12);
        }
        
        function getMonthExpenses(categoryId) {
            const now = new Date();
            const year = now.getFullYear();
            const month = now.getMonth() + 1;
            
            return expenses.filter(e => {
                const d = new Date(e.date);
                return d.getFullYear() === year && 
                       d.getMonth() + 1 === month && 
                       e.categoryId === categoryId;
            });
        }
        
        function getMonthSpent(categoryId) {
            return getMonthExpenses(categoryId).reduce((sum, e) => sum + e.amount, 0);
        }

        // ==================== 数据加载/保存 ====================
        async function loadDataFromCloud() {
            setSyncStatus('syncing');
            
            try {
                const { data: configData } = await db
                    .from('user_configs')
                    .select('categories')
                    .eq('user_id', currentUser)
                    .maybeSingle();
                
                if (configData && configData.categories && configData.categories.length > 0) {
                    categories = configData.categories;
                } else {
                    categories = JSON.parse(JSON.stringify(DEFAULT_CATEGORIES));
                    await saveCategoriesToCloud();
                }
                
                const { data: expenseData } = await db
                    .from('expenses')
                    .select('*')
                    .eq('user_id', currentUser)
                    .order('date', { ascending: false });
                
                if (expenseData && expenseData.length > 0) {
                    expenses = expenseData.map(e => ({
                        id: e.id,
                        date: e.date,
                        item: e.item,
                        amount: parseFloat(e.amount),
                        categoryId: e.category_id,
                        categoryName: e.category_name,
                        type: e.type
                    }));
                } else {
                    expenses = [];
                }
                
                setSyncStatus('synced');
                init();
                
            } catch (error) {
                console.error('加载数据:', error);
                setSyncStatus('synced');
                const localCat = localStorage.getItem('finance_categories_' + currentUser);
                const localExp = localStorage.getItem('finance_expenses_' + currentUser);
                categories = localCat ? JSON.parse(localCat) : JSON.parse(JSON.stringify(DEFAULT_CATEGORIES));
                expenses = localExp ? JSON.parse(localExp) : [];
                init();
            }
        }

            input.onchange = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                
                const reader = new FileReader();
                reader.onload = async (e) => {
                    try {
                        const data = JSON.parse(e.target.result);
                        
                        if (data.categories) {
                            categories = data.categories;
                            await saveCategoriesToCloud();
                        }
                        
                        if (data.expenses && data.expenses.length > 0) {
                            if (confirm(`确定导入 ${data.expenses.length} 条记录吗？这将覆盖现有数据。`)) {
                                // 删除旧数据
                                await db.from('expenses').delete().eq('user_id', currentUser);
                                
                                // 插入新数据
                                const expData = data.expenses.map(e => ({
                                    user_id: currentUser,
                                    date: e.date,
                                    item: e.item,
                                    amount: e.amount,
                                    category_id: e.categoryId,
                                    category_name: e.categoryName || categories.find(c => c.id === e.categoryId)?.name || '未知',
                                    type: e.type || categories.find(c => c.id === e.categoryId)?.type || '弹性'
                                }));
                                
                                await db.from('expenses').insert(expData);
                                await loadDataFromCloud();
                                showToast(`成功导入 ${data.expenses.length} 条记录`, 'success');
                            }

                    } catch (err) {
                        showToast('导入失败：文件格式错误', 'error');
                    }
                };
                reader.readAsText(file);
            };
            input.click();
        }

        function parseQuickInput() {
            const input = document.getElementById('quickInput').value.trim();
            if (!input) return;
            
            const amountMatch = input.match(/(\d+\.?\d*)/);
            const amount = amountMatch ? parseFloat(amountMatch[1]) : 0;
            
            let date = new Date();
            if (input.includes('昨天')) date.setDate(date.getDate() - 1);
            else if (input.includes('前天')) date.setDate(date.getDate() - 2);
            
            let item = input
                .replace(/今天|昨天|前天/g, '')
                .replace(/\d+\.?\d*块?元?/g, '')
                .trim();
            
            let matchedCategory = categories.find(c => c.type === '日常')?.id || 1;
            for (const [keyword, catId] of Object.entries(KEYWORDS)) {
                if (input.toLowerCase().includes(keyword.toLowerCase())) {
                    if (categories.find(c => c.id === catId)) {
                        matchedCategory = catId;
                    }
                    break;
                }
            }
            
            document.getElementById('expenseDate').value = date.toISOString().split('T')[0];
            document.getElementById('expenseItem').value = item || input.replace(/\d+\.?\d*/g, '').trim();
            document.getElementById('expenseAmount').value = amount;
            selectCategory(matchedCategory);
            
            document.getElementById('quickInput').value = '';
            showToast('已解析，请确认后保存', 'success');
        }
        
        async function saveExpense() {
            const date = document.getElementById('expenseDate').value;
            const item = document.getElementById('expenseItem').value.trim();
            const amount = parseFloat(document.getElementById('expenseAmount').value);
            
            if (!date || !item || !amount || !selectedCategory) {
                showToast('请填写完整信息', 'error');
                return;
            }
            
            const cat = categories.find(c => c.id === selectedCategory);
            const expense = {
                id: Date.now(),
                date,
                item,
                amount,
                categoryId: selectedCategory,
                categoryName: cat.name,
                type: cat.type
            };
            
            expenses.unshift(expense);
            await saveExpenseToCloud(expense);
            
            document.getElementById('expenseItem').value = '';
            document.getElementById('expenseAmount').value = '';
            selectedCategory = null;
            renderCategoryGrid();
            renderBudgetStatus();
            
            showToast(`已保存 ¥${amount}`, 'success');
        }
        
        // ==================== 预算页面 ====================
        function renderBudgetStatus() {
            const now = new Date();
            
            let rigidSpent = 0, dailySpent = 0, flexibleSpent = 0;
            let dailyBudget = 0, flexibleBudget = 0;
            
            categories.forEach(cat => {
                const spent = getMonthSpent(cat.id);
                if (cat.type === '刚性') rigidSpent += spent;
                else if (cat.type === '日常') {
                    dailySpent += spent;
                    dailyBudget += getMonthly(cat);
                } else {
                    flexibleSpent += spent;
                    flexibleBudget += getMonthly(cat);
                }
            });
            
            const totalBudget = dailyBudget + flexibleBudget;
            const budgetSpent = dailySpent + flexibleSpent;
            const budgetRate = budgetSpent / totalBudget;
            
            document.getElementById('summaryCards').innerHTML = `
                <div class="summary-card ${budgetRate >= 1 ? 'danger' : budgetRate >= 0.8 ? 'warning' : 'success'}">
                    <h3>本月可控支出</h3>
                    <div class="amount">¥${budgetSpent.toFixed(0)}</div>
                    <div class="sub">预算 ¥${totalBudget} | ${(budgetRate*100).toFixed(1)}%</div>
                </div>
                <div class="summary-card">
                    <h3>刚性支出</h3>
                    <div class="amount">¥${rigidSpent.toFixed(0)}</div>
                    <div class="sub">不计入月预算</div>
                </div>
                <div class="summary-card ${dailySpent/dailyBudget >= 1 ? 'danger' : dailySpent/dailyBudget >= 0.8 ? 'warning' : ''}">
                    <h3>日常支出</h3>
                    <div class="amount">¥${dailySpent.toFixed(0)}</div>
                    <div class="sub">预算 ¥${dailyBudget}</div>
                </div>
                <div class="summary-card ${flexibleSpent/flexibleBudget >= 1 ? 'danger' : flexibleSpent/flexibleBudget >= 0.8 ? 'warning' : ''}">
                    <h3>弹性支出</h3>
                    <div class="amount">¥${flexibleSpent.toFixed(0)}</div>
                    <div class="sub">预算 ¥${flexibleBudget}</div>
                </div>
                <div class="summary-card">
                    <h3>本月总支出</h3>
                    <div class="amount">¥${(rigidSpent + budgetSpent).toFixed(0)}</div>
                    <div class="sub">含刚性支出</div>
                </div>
                <div class="summary-card success">
                    <h3>剩余预算</h3>
                    <div class="amount">¥${Math.max(0, totalBudget - budgetSpent).toFixed(0)}</div>
                    <div class="sub">可控部分</div>
                </div>
            `;
            
            // 类目详情列表
            let html = '';
            categories.forEach(cat => {
                const spent = getMonthSpent(cat.id);
                const monthly = getMonthly(cat);
                const rate = spent / monthly;
                const expanded = expandedCategories.has(cat.id);
                const catExpenses = getMonthExpenses(cat.id);
                
                let statusClass = 'ok';
                if (cat.type !== '刚性') {
                    if (rate >= 1) statusClass = 'danger';
                    else if (rate >= 0.8) statusClass = 'warning';
                }
                
                html += `
                    <div class="budget-category ${expanded ? 'expanded' : ''}" onclick="toggleCategory(${cat.id})">
                        <div class="budget-category-header">
                            <div>
                                <div class="name">${cat.id}. ${cat.name}</div>
                                <div style="font-size: 12px; color: var(--gray-600);">${cat.type} | 预算 ¥${monthly}/月</div>
                            </div>
                            <div class="spent" style="color: ${statusClass === 'danger' ? 'var(--danger)' : statusClass === 'warning' ? 'var(--warning)' : 'inherit'}">
                                ¥${spent.toFixed(0)}
                            </div>
                            <div class="progress-mini">
                                <div class="fill ${statusClass}" style="width: ${Math.min(rate * 100, 100)}%"></div>
                            </div>
                            <div class="toggle">▼</div>
                        </div>
                        <div class="budget-category-detail">
                            ${catExpenses.length > 0 ? catExpenses.map(e => `
                                <div class="detail-item">
                                    <span class="date">${e.date.slice(5)}</span>
                                    <span class="item">${e.item}</span>
                                    <span class="amount">¥${e.amount.toFixed(2)}</span>
                                </div>
                            `).join('') : '<div class="no-data">本月暂无消费记录</div>'}
                        </div>
                    </div>
                `;
            });
            
            document.getElementById('budgetList').innerHTML = html;
        }

        async function saveEditExpense(id) {
            const date = document.getElementById('editDate').value;
            const item = document.getElementById('editItem').value.trim();
            const amount = parseFloat(document.getElementById('editAmount').value);
            const categoryId = parseInt(document.getElementById('editCategory').value);
            const cat = categories.find(c => c.id === categoryId);
            
            const expense = expenses.find(e => e.id === id);
            if (expense) {
                expense.date = date;
                expense.item = item;
                expense.amount = amount;
                expense.categoryId = categoryId;
                expense.categoryName = cat.name;
                expense.type = cat.type;
                
                try {
                    await db.from('expenses').update({
                        date, item, amount,
                        category_id: categoryId,
                        category_name: cat.name,
                        type: cat.type
                    }).eq('id', id);
                } catch (e) {
                    console.error('更新失败:', e);
                }
                
                localStorage.setItem('finance_expenses_' + currentUser, JSON.stringify(expenses));
            }
            
            closeEditModal();
            renderHistory();
            renderBudgetStatus();
            showToast('已更新', 'success');
        }
        
        async function deleteExpense(id) {
            if (!confirm('确定删除这条记录吗？')) return;
            
            expenses = expenses.filter(e => e.id !== id);
            await deleteExpenseFromCloud(id);
            renderHistory();
            renderBudgetStatus();
            showToast('已删除', 'success');
        }
        
        // ==================== 设置页面 ====================
        function renderSettings() {
            document.getElementById('settingsList').innerHTML = categories.map((cat, index) => `
                <div class="category-setting-item" style="background: ${cat.type === '刚性' ? 'var(--pink-100)' : cat.type === '日常' ? '#fefcbf' : 'var(--green-100)'}">
                    <span style="font-weight: 600;">${cat.id}</span>
                    <input type="text" value="${cat.name}" onchange="updateCategory(${index}, 'name', this.value)">
                    <input type="number" value="${cat.yearly}" onchange="updateCategory(${index}, 'yearly', parseInt(this.value))">
                    <select onchange="updateCategory(${index}, 'type', this.value)">
                        <option value="刚性" ${cat.type === '刚性' ? 'selected' : ''}>刚性</option>
                        <option value="日常" ${cat.type === '日常' ? 'selected' : ''}>日常</option>
                        <option value="弹性" ${cat.type === '弹性' ? 'selected' : ''}>弹性</option>
                    </select>
                    <button class="delete-btn" onclick="deleteCategory(${index})">🗑️</button>
                </div>
            `).join('');
        }
        
        async function updateCategory(index, field, value) {
            categories[index][field] = value;
            await saveCategoriesToCloud();
            renderCategoryGrid();
            renderBudgetTip();
            renderBudgetStatus();
        }
        
        async function deleteCategory(index) {
            if (!confirm('确定删除这个类目吗？')) return;
            categories.splice(index, 1);
            // 重新编号
            categories.forEach((cat, i) => cat.id = i + 1);
            await saveCategoriesToCloud();
            renderSettings();
            renderCategoryGrid();
            renderBudgetTip();
            renderBudgetStatus();
            showToast('已删除', 'success');
        }
        
        async function addCategory() {
            const newId = categories.length > 0 ? Math.max(...categories.map(c => c.id)) + 1 : 1;
            categories.push({
                id: newId,
                name: '新类目',
                yearly: 6000,
                type: '弹性'
            });
            await saveCategoriesToCloud();
            renderSettings();
            renderCategoryGrid();
            showToast('已添加', 'success');
        }
        
        // ==================== AI分析 ====================
        async function generateAIReport() {
            const btn = event.target;
            btn.disabled = true;
            btn.textContent = '🤖 分析中...';
            
            document.getElementById('aiReport').textContent = '🤖 专业理财师正在分析您的财务数据...\n\n请稍候，正在生成：\n• 本月诊断报告\n• 下月财务计划\n• 年度财务规划';
            
            const now = new Date();
            const year = now.getFullYear();
            const month = now.getMonth() + 1;
            const day = now.getDate();
            const daysInMonth = new Date(year, month, 0).getDate();
            const timeProgress = (day / daysInMonth * 100).toFixed(1);
            
            // 计算各类数据
            let rigidSpent = 0, dailySpent = 0, flexibleSpent = 0;
            let dailyBudget = 0, flexibleBudget = 0;
            
            categories.forEach(cat => {
                const spent = getMonthSpent(cat.id);
                if (cat.type === '刚性') rigidSpent += spent;
                else if (cat.type === '日常') {
                    dailySpent += spent;
                    dailyBudget += getMonthly(cat);
                } else {
                    flexibleSpent += spent;
                    flexibleBudget += getMonthly(cat);
                }
            });
            
            const totalBudget = dailyBudget + flexibleBudget;
            const budgetSpent = dailySpent + flexibleSpent;
            const spendingProgress = (budgetSpent / totalBudget * 100).toFixed(1);
            
            // 类目详情
            let categoryDetails = categories.map(cat => {
                const spent = getMonthSpent(cat.id);
                const monthly = getMonthly(cat);
                const rate = (spent / monthly * 100).toFixed(1);
                return `${cat.name}：已花¥${spent.toFixed(0)}，预算¥${monthly}，${rate}%`;
            }).join('\n');
            
            // 消费明细TOP10
            const monthExpenses = expenses.filter(e => {
                const d = new Date(e.date);
                return d.getFullYear() === year && d.getMonth() + 1 === month;
            }).sort((a, b) => b.amount - a.amount).slice(0, 10);
            
            let top10 = monthExpenses.map(e => `${e.date.slice(5)} ${e.item} ¥${e.amount}`).join('\n');
            
            const prompt = `你是一位CFP持证的专业理财师。请根据以下数据为用户生成专业、实用的财务分析报告。

【用户基本信息】
用户：${currentUser}
时间：${year}年${month}月${day}日

【预算设置】
月可控预算：¥${totalBudget}（日常¥${dailyBudget} + 弹性¥${flexibleBudget}）

【本月消费情况】
时间进度：${timeProgress}%
消费进度：${spendingProgress}%
日均消费：¥${(budgetSpent / day).toFixed(0)}
预计月末：¥${(budgetSpent / day * daysInMonth).toFixed(0)}

刚性支出：¥${rigidSpent.toFixed(0)}
日常支出：¥${dailySpent.toFixed(0)}（预算¥${dailyBudget}）
弹性支出：¥${flexibleSpent.toFixed(0)}（预算¥${flexibleBudget}）

【各类目明细】
${categoryDetails}

【TOP10消费】
${top10 || '暂无数据'}

请按以下格式输出报告：

📊 本月诊断
（评估财务健康度，指出2-3个核心问题，分析消费行为）

📅 下月财务计划
（具体的预算分配建议，需要控制的类目，省钱策略，月度目标）

📈 年度财务规划
（全年预算预测，储蓄目标建议，季度里程碑）

✅ 行动清单
本周必做：
1. xxx
2. xxx
3. xxx

本月必做：
1. xxx
2. xxx
3. xxx

长期习惯：
1. xxx
2. xxx

💬 理财师寄语
（2-3句鼓励和建议）`;

            try {
                const response = await fetch('https://open.bigmodel.cn/api/paas/v4/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${ZHIPU_API_KEY}`
                    },
                    body: JSON.stringify({
                        model: 'glm-4-flash',
                        messages: [{ role: 'user', content: prompt }],
                        temperature: 0.7,
                        max_tokens: 3000
                    })
                });
                
                const data = await response.json();
                
                if (data.choices && data.choices[0]) {
                    const report = data.choices[0].message.content;
                    document.getElementById('aiReport').innerHTML = `
                        <div style="color: var(--gray-600); font-size: 12px; margin-bottom: 15px;">
                            📅 生成时间：${new Date().toLocaleString()} | 👤 用户：${currentUser}
                        </div>
                        ${report.replace(/\n/g, '<br>')}
                    `;
                } else {
                    throw new Error('AI返回数据异常');
                }
            } catch (error) {
                console.error('AI分析失败:', error);
                document.getElementById('aiReport').textContent = '❌ 分析失败，请稍后重试\n\n错误信息：' + error.message;
            }
            
            btn.disabled = false;
            btn.textContent = '🤖 生成理财分析报告';
        }
        
        // ==================== 自动登录 ====================
        window.onload = function() {
            const savedUser = localStorage.getItem('finance_user');
            if (savedUser) {
                document.getElementById('loginNickname').value = savedUser;
            }
        };
    </script>
</body>
</html>
